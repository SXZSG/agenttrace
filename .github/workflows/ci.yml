name: CI

on:
  push:
    branches: [main, "feature/**", "fix/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run tests with coverage
        run: |
          coverage run -m pytest -q
          coverage report --include="src/agenttrace/*" --fail-under=85
      - name: Compile source files
        run: python -m compileall -q src tests
      - name: Check for basic lint errors
        run: ruff check .
      - name: Run offline reliability smoke test
        run: python -m agenttrace failure-benchmark --scenario CF-04-B --strict
